<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Fallbacks for the proprietary SF fonts, which are not installed. If the real fonts
       are installed later they win automatically; <accept> only applies when they are missing. -->
  <alias>
    <family>SF Pro</family>
    <accept><family>Adwaita Sans</family></accept>
  </alias>
  <alias>
    <family>Liga SFMono Nerd Font</family>
    <accept><family>SF Mono Powerline</family><family>JetBrainsMono Nerd Font</family></accept>
  </alias>
</fontconfig>
