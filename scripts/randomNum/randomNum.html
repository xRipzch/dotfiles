<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilfældige tal</title>
<style>
  :root{
    --paper:#F5F7F3;
    --card:#FFFFFF;
    --ink:#16201A;
    --muted:#5A6B5C;
    --rule:#D4DBD1;
    --green:#1B6B47;
    --green-dark:#134D33;
    --amber:#9C6318;
    --display:Georgia,"Times New Roman",serif;
    --ui:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --mono:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
  }

  *{box-sizing:border-box}

  html,body{margin:0;padding:0}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--ui);
    font-size:17px;
    line-height:1.5;
    padding:32px 20px 64px;
  }

  .wrap{max-width:640px;margin:0 auto}

  .eyebrow{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 6px;
  }

  h1{
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(30px,7vw,44px);
    line-height:1.1;
    letter-spacing:-.01em;
    margin:0 0 8px;
  }

  .lede{margin:0 0 28px;color:var(--muted);max-width:46ch}

  .panel{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:22px 22px 26px;
  }

  .label{
    display:block;
    font-size:13px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 7px;
  }

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  .field-wide{grid-column:1 / -1}

  input[type=number]{
    width:100%;
    font-family:var(--mono);
    font-size:22px;
    padding:11px 13px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--rule);
    border-radius:3px;
  }
  input[type=number]:focus{border-color:var(--green);outline:2px solid rgba(27,107,71,.25);outline-offset:1px}

  .go{
    width:100%;
    margin-top:24px;
    font-family:var(--ui);
    font-size:18px;
    font-weight:600;
    padding:15px;
    color:#fff;
    background:var(--green);
    border:1px solid var(--green-dark);
    border-radius:3px;
    cursor:pointer;
  }
  .go:hover{background:var(--green-dark)}

  button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  .note{margin:14px 0 0;font-size:15px;color:var(--amber);min-height:1.5em}

  /* resultat: en kolonne, som i regnearket. Hver række er en knap. */
  .result{margin-top:34px;display:none}
  .result.shown{display:block}

  .result-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }
  .count{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

  .sheet{
    border:1px solid var(--rule);
    border-radius:4px;
    background:#fff;
    overflow:hidden;
    max-height:62vh;
    overflow-y:auto;
  }

  .row{
    display:grid;
    grid-template-columns:56px 1fr 108px;
    align-items:center;
    width:100%;
    text-align:left;
    font:inherit;
    color:inherit;
    background:#fff;
    border:0;
    border-top:1px solid #EDF0EB;
    padding:0;
    cursor:pointer;
  }
  .row:first-child{border-top:0}
  .row:hover{background:#F2F7F3}
  .row:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}

  .rownum{
    font-family:var(--mono);
    font-size:13px;
    color:#93A093;
    text-align:right;
    padding:12px 10px 12px 0;
    background:#FAFBF9;
    border-right:1px solid var(--rule);
    user-select:none;
  }

  .cell{
    font-family:var(--mono);
    font-size:21px;
    letter-spacing:.04em;
    padding:11px 14px;
    word-break:break-all;
  }

  .state{
    font-family:var(--ui);
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
    text-align:right;
    padding:11px 14px 11px 0;
    color:#B4BEB3;
    user-select:none;
  }

  .row.done{background:#FAFBF9}
  .row.done .cell{color:#8E9B8E}
  .row.done .state{color:var(--green)}
  .row.done:hover{background:#F2F7F3}
  .row.done:hover .cell{color:var(--ink)}

  .hint{margin:12px 0 0;font-size:14px;color:var(--muted)}

  .sink{position:absolute;left:-9999px;top:0;opacity:0}

  @media (max-width:480px){
    .fields{grid-template-columns:1fr}
    .row{grid-template-columns:44px 1fr 96px}
    .cell{font-size:19px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">By: Anders Lyk Ravn</p>
  <h1>Tilfældige tal generator</h1>
  <p class="lede">Skriv det mindste tal, det største tal, og hvor mange du skal bruge.</p>
  

  <div class="panel">

    <div class="fields">
      <div>
        <input type="number" id="min" placeholder="Mindste tal" step="1" inputmode="numeric">
      </div>
      <div>
        <input type="number" id="max" placeholder="Største tal" step="1" inputmode="numeric">
      </div>
      <div class="field-wide">
        <input type="number" id="antal" placeholder="Antal genereret tal" min="1" step="1" inputmode="numeric inputmode="numeric"">
      </div>
    </div>

    <button type="button" class="go" id="go">Lav tallene</button>
    <p class="note" id="note"></p>
    <p class="eyebrow">Klik på tallene for nemt at kopier dem.</p>
  </div>

  <div class="result" id="result">
    <div class="result-top">
      <span class="count" id="count"></span>
    </div>
    <div class="sheet" id="sheet"></div>
  </div>

</div>

<textarea class="sink" id="sink" readonly aria-hidden="true"></textarea>

<script>
(function(){
  "use strict";

  var LOFT = 50000;          // hvor mange tal ad gangen
  var POT32 = 4294967296;    // 2^32

  var elMin = document.getElementById("min");
  var elMax = document.getElementById("max");
  var elAntal = document.getElementById("antal");
  var elNote = document.getElementById("note");
  var elResult = document.getElementById("result");
  var elSheet = document.getElementById("sheet");
  var elCount = document.getElementById("count");
  var elSink = document.getElementById("sink");

  var current = [];
  var copied = 0;
  var timers = {};

  // Uniform i [min, min+range-1]. Afvisning fjerner modulo-bias.
  function randSmall(min, range){
    var limit = POT32 - (POT32 % range);
    var buf = new Uint32Array(1);
    var v;
    do {
      crypto.getRandomValues(buf);
      v = buf[0];
    } while (v >= limit);
    return min + (v % range);
  }

  // Intervaller over 2^32: samme princip med BigInt.
  function randBig(min, range){
    var r = BigInt(range);
    var bits = r.toString(2).length;
    var bytes = Math.ceil(bits / 8);
    var mask = (1n << BigInt(bits)) - 1n;
    var buf = new Uint8Array(bytes);
    var v;
    do {
      crypto.getRandomValues(buf);
      v = 0n;
      for (var i = 0; i < bytes; i++) v = (v << 8n) | BigInt(buf[i]);
      v = v & mask;
    } while (v >= r);
    return min + Number(v);
  }

  function pick(min, range){
    return range <= POT32 ? randSmall(min, range) : randBig(min, range);
  }

  // Altid uden gengangere.
  function draw(min, max, antal){
    var out = [], i;
    var range = max - min + 1;

    // Lille interval: bland en pose og træk uden tilbagelægning.
    if (range <= 500000){
      var pool = new Array(range);
      for (i = 0; i < range; i++) pool[i] = min + i;
      for (i = 0; i < antal; i++){
        var j = i + pick(0, range - i);
        var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
        out.push(pool[i]);
      }
      return out;
    }

    // Stort interval: sammenstød er sjældne, så træk og kassér gengangere.
    var seen = Object.create(null);
    while (out.length < antal){
      var n = pick(min, range);
      if (!seen[n]){ seen[n] = 1; out.push(n); }
    }
    return out;
  }

  function say(msg){ elNote.textContent = msg || ""; }

  function generate(){
    var min = parseInt(elMin.value, 10);
    var max = parseInt(elMax.value, 10);
    var antal = parseInt(elAntal.value, 10);

    if (!isFinite(min) || !isFinite(max)){
      say("Skriv et tal i både Fra og Til."); return;
    }
    if (!Number.isSafeInteger(min) || !Number.isSafeInteger(max)){
      say("Tallene må højst have 15 cifre."); return;
    }
    if (min > max){
      var s = min; min = max; max = s;
      elMin.value = min; elMax.value = max;
    }
    if (!isFinite(antal) || antal < 1){
      say("Skriv hvor mange tal du skal bruge — mindst 1."); return;
    }
    if (antal > LOFT){
      say("Højst " + LOFT.toLocaleString("da-DK") + " tal ad gangen."); return;
    }

    var range = max - min + 1;
    if (antal > range){
      say("Der findes kun " + range.toLocaleString("da-DK") + " forskellige tal mellem " + min + " og " + max + ". Bed om færre, eller vælg et bredere interval.");
      return;
    }

    say("");
    current = draw(min, max, antal);
    copied = 0;
    timers = {};
    render();
  }

  function render(){
    var parts = [];
    for (var i = 0; i < current.length; i++){
      parts.push(
        '<button type="button" class="row" data-i="' + i + '">' +
          '<span class="rownum">' + (i+1) + '</span>' +
          '<span class="cell">' + current[i] + '</span>' +
          '<span class="state"></span>' +
        '</button>'
      );
    }
    elSheet.innerHTML = parts.join("");
    elSheet.scrollTop = 0;
    updateCount();
    elResult.classList.add("shown");
  }

  function updateCount(){
    elCount.textContent = copied + " af " + current.length + " kopieret";
  }

  function copyText(text, ok, fail){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, function(){ legacy(text, ok, fail); });
    } else {
      legacy(text, ok, fail);
    }
  }

  function legacy(text, ok, fail){
    elSink.value = text;
    elSink.style.position = "fixed";
    elSink.style.left = "0";
    elSink.select();
    var worked = false;
    try { worked = document.execCommand("copy"); } catch(e){ worked = false; }
    elSink.style.position = "absolute";
    elSink.style.left = "-9999px";
    worked ? ok() : fail();
  }

  elSheet.addEventListener("click", function(e){
    var row = e.target.closest ? e.target.closest(".row") : null;
    if (!row) return;
    var i = parseInt(row.getAttribute("data-i"), 10);
    var state = row.querySelector(".state");

    copyText(String(current[i]), function(){
      if (!row.classList.contains("done")){
        row.classList.add("done");
        copied++;
        updateCount();
      }
      state.textContent = "Kopieret \u2713";
      clearTimeout(timers[i]);
      timers[i] = setTimeout(function(){ state.textContent = "\u2713"; }, 1600);
    }, function(){
      state.textContent = "Ctrl+C";
    });
  });

  document.getElementById("go").addEventListener("click", generate);

  Array.prototype.forEach.call([elMin, elMax, elAntal], function(inp){
    inp.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); generate(); }
    });
  });
})();
</script>
</body>
</html>
