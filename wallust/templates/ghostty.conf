{#- Background, foreground and cursor follow the wallpaper. The 16 ANSI slots keep
    their meaning (red is red, green is green): wallust's own color1-15 are
    wallpaper hues in arbitrary order, which turned fish's "error" red into a
    dim grey. Each slot is a fixed hue tinted 25% toward the wallpaper's
    foreground (two blends), so it harmonises with the wallpaper and stays
    readable: >= 4.6:1 on every wallpaper tested, autosuggestions ~4.5:1. -#}
background = {{background | darken(0.35)}}
foreground = {{foreground | lighten(0.6)}}

selection-background = {{background | darken(0.35) | lighten(0.2)}}
selection-foreground = {{foreground | lighten(0.6)}}

cursor-color = {{cursor}}
cursor-text = {{background | darken(0.35)}}

palette = 0={{background | darken(0.35) | lighten(0.12)}}
palette = 1={{foreground | blend("#FF7B72") | blend("#FF7B72")}}
palette = 2={{foreground | blend("#7EE787") | blend("#7EE787")}}
palette = 3={{foreground | blend("#F2CC60") | blend("#F2CC60")}}
palette = 4={{foreground | blend("#79C0FF") | blend("#79C0FF")}}
palette = 5={{foreground | blend("#D2A8FF") | blend("#D2A8FF")}}
palette = 6={{foreground | blend("#56D4DD") | blend("#56D4DD")}}
palette = 7={{foreground | lighten(0.4)}}
palette = 8={{background | darken(0.35) | lighten(0.5)}}
palette = 9={{foreground | blend("#FF7B72") | blend("#FF7B72") | lighten(0.15)}}
palette = 10={{foreground | blend("#7EE787") | blend("#7EE787") | lighten(0.15)}}
palette = 11={{foreground | blend("#F2CC60") | blend("#F2CC60") | lighten(0.15)}}
palette = 12={{foreground | blend("#79C0FF") | blend("#79C0FF") | lighten(0.15)}}
palette = 13={{foreground | blend("#D2A8FF") | blend("#D2A8FF") | lighten(0.15)}}
palette = 14={{foreground | blend("#56D4DD") | blend("#56D4DD") | lighten(0.15)}}
palette = 15={{foreground | lighten(0.8)}}
