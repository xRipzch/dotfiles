# AUTOSTART APPLICATIONS
exec-once = waybar
exec-once = hypridle
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = udiskie
exec-once = swaync
exec-once = easyeffects --gapplication-service
exec-once = gnome-keyring-daemon --start --components=secrets
# awww-daemon has crashed intermittently on this dual-GPU (amdgpu card1+card2) setup;
# auto-restart it on crash instead of leaving the background black until next login.
exec-once = sh -c 'until awww-daemon; do sleep 1; done'
exec-once = sleep 2 && waytrogen -r
exec-once = hyprswitch init --show-title --size-factor 5 --workspaces-per-row 4 --custom-css $configDir/hyprswitch.css

# Forces a fresh cursor-plane render, clearing a stale default-arrow artifact left over
# from before the themed cursor is applied at boot (dual-GPU hardware cursor plane bug).
exec-once = sh -c 'sleep 1 && hyprctl keyword cursor:no_hardware_cursors true && hyprctl keyword cursor:no_hardware_cursors false'
