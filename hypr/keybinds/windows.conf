# WINDOW MANAGEMENT KEYBINDINGS
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod ALT, F, fullscreen, 0
bind = $mainMod, bracketleft, layoutmsg, mfact -0.05
bind = $mainMod, bracketright, layoutmsg, mfact +0.05

# FREE DRAG / RESIZE (hold mod+key, move mouse; release to drop)
bindm = $mainMod, X, movewindow
bindm = $mainMod, Z, resizewindow

# WINDOW FOCUS
# $mainMod + l is the lock bind - use $mainMod + right to focus right
bind = $mainMod, h, movefocus, l
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# WINDOW MOVEMENT
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# SIZE ADJUSTMENT
bind = $mainMod, R, submap, resize
submap = resize

binde = , l, resizeactive, 20 0
binde = , h, resizeactive, -20 0
binde = , k, resizeactive, 0 -20
binde = , j, resizeactive, 0 20

bind = , escape, submap, reset
submap = reset
