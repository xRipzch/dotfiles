source = $HOME/.config/hypr/config/variables.conf

# FLOATING WINDOW RULES
#
# WARNING: Hyprland 0.56 no longer applies hyprlang "windowrule" lines. They parse
# without any config error, which is why this looks healthy, but nothing matches.
# Verified 2026-08-31 with a throwaway class + a fresh window: still opened tiled,
# while the same rules passed to the exec dispatcher worked. The launcher scripts
# in ../scripts/ therefore do the floating themselves.
# Migrating these to hl.window_rule() in a Lua config is the real fix.
windowrule = float class:^(xdg-desktop-portal-gtk)$
windowrule = float class:^($terminal)$ title:^(top)$
windowrule = float class:^($terminal)$ title:^(btm)$
windowrule = float class:^($terminal)$ title:^(htop)$
windowrule = float size 1200 780 class:^($terminal)$ title:^(btop)$
windowrule = float class:^(thunar)$ title:^(Rename.*)$
windowrule = float class:^(Thunar)$ title:^(Rename.*)$
windowrule = float class:^(org.gnome.FileRoller)$
windowrule = float class:^(qt5ct)$
windowrule = float class:^(qt6ct)$
windowrule = float class:^(nwg-look)$
windowrule = float class:^(nwg-displays)$
windowrule = float class:^(org.pulseaudio.pavucontrol)$
windowrule = float class:^(blueman-manager)$
windowrule = float class:^(nm-connection-editor)$
windowrule = float class:^(org.Waytrogen.Waytrogen)$
windowrule = float class:^(waytrogen)$
windowrule = float class:^(com.github.unrud.VideoDownloader)$
windowrule = float class:^(com.interversehq.qView)$
windowrule = float class:^(WebApp-Messenger4386)$
windowrule = size 1400 820 class:^(WebApp-Messenger4386)$
windowrule = center class:^(WebApp-Messenger4386)$
windowrule = float class:^(discord)$
windowrule = size 1000 820 class:^(discord)$
windowrule = center class:^(discord)$