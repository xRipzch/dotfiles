source = $HOME/.config/hypr/config/variables.conf
# NOTE: suppressevent/nofocus/noblur rule types removed in this Hyprland version (0.55.4)
# Ignore maximize requests from apps
# windowrule = suppressevent maximize class:.*
# Fix some dragging issues with XWayland
# windowrule = nofocus class:^$ title:^$ xwayland:1 floating:1 fullscreen:0 pinned:0
# No blur for empty class/title
# windowrule = noblur class:^()$ title:^()$

# Dedicated special workspace for Spotify (opened via $mainMod, M)
# Discord is a centered floating window instead - see rules/floating.conf
windowrule = workspace special:spotify silent class:^(spotify)$
